name: CI/CD Pipeline

on:
  push:
    branches:
      - dev
      - prod
 
env:
  ENV_NAME: ${{ (github.ref_name == 'prod' || github.ref_name == 'main') && 'prod' || 'dev' }}

jobs:
  infra-checkov:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v2
      - name: Set up Docker
        uses: docker/setup-buildx-action@v1
      - name: Set execute permissions
        run: chmod +x ./tasks
      - name: Set up Bash
        run: sudo apt-get install -y bash
      - name: Run Checkov
        run: |
          chmod +x ./tasks
          ./tasks checkov_alpine
        continue-on-error: true
        if: always()
      - name: Upload Checkov Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: checkov-report
          path: results.xml

  scripts-shellcheck:
    runs-on: ubuntu-latest
    needs: infra-checkov
    steps:
      - name: Checkout code
        uses: actions/checkout@v2
      - name: Set up Bash
        run: sudo apt-get install -y bash
      - name: Set execute permissions
        run: chmod +x ./tasks
      - name: Run ShellCheck
        run: |
          chmod +x ./tasks
          ./tasks shellcheck_alpine || true
      - name: Upload ShellCheck Report
        uses: actions/upload-artifact@v4
        with:
          name: shellcheck-report
          path: shellcheck_report.xml

  scripts-unit-tests:
    runs-on: ubuntu-latest
    needs: scripts-shellcheck
    steps:
      - name: Checkout code
        uses: actions/checkout@v2
      - name: Set execute permissions
        run: chmod +x ./tasks
      - name: Set up Bash
        run: sudo apt-get install -y bash
      - name: Run Unit Tests
        run: ./tasks bats_alpine
      - name: Upload Unit Test Report
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-report
          path: upload/test/bats/report.xml

  lambda-unit-tests:
    runs-on: ubuntu-latest
    if: false # Disabled for now
    continue-on-error: true
    steps:
      - name: Checkout code
        uses: actions/checkout@v2
      - name: Set execute permissions
        run: chmod +x ./tasks
      - name: Set up Bash
        run: sudo apt-get install -y bash
      - name: Run Lambda Unit Tests
        run: ./tasks lambda_unit_tests_alpine
      - name: Upload Lambda Unit Test Report
        uses: actions/upload-artifact@v4
        with:
          name: lambda-unit-test-report
          path: processing/report.xml

  lambda-integration-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v2
      - name: Set up Bash
        run: sudo apt-get install -y bash
      - name: Set execute permissions
        run: chmod +x ./tasks
      - name: Run Lambda Integration Tests
        run: |
          chmod +x ./tasks
          echo "TODO - lambda-integration-tests"
          exit 1
        continue-on-error: true

  lambda-package:
    runs-on: ubuntu-latest
    needs: lambda-integration-tests
    environment: ${{ (github.ref_name == 'prod' || github.ref_name == 'main') && 'prod' || 'dev' }}
    strategy:
      matrix:
        function:
          - ingress
          - media_convert
          - pretrained_annotation
          - biigle_anno_retrieval
          - taxonomy
    container:
      image: python:3.12-bookworm
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      - name: Install Install dependencies
        run: apt-get update && apt-get install -y awscli zip
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-southeast-2
      - name: Make packaging script executable
        run: chmod +x ./lambda/scripts/create_pkg.sh

      - name: Cache Lambda zip - ${{ matrix.function }}
        id: lambda_cache
        uses: actions/cache@v3
        with:
          path: infrastructure/2-seafloor-data/lambda_${{ matrix.function }}.zip
          key: ${{ matrix.function }}-${{ hashFiles(format('lambda/lambda_functions/{0}/**', matrix.function)) }}
      - name: Package Lambda - ${{ matrix.function }}
        if: steps.lambda_cache.outputs.cache-hit != 'true'
        shell: bash
        run: ./lambda/scripts/create_pkg.sh $PWD/lambda ${{ matrix.function }} python3
      - name: Upload Lambda zip to S3
        if: steps.lambda_cache.outputs.cache-hit != 'true'
        run: |
          AWS_ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
          echo "aws s3 cp infrastructure/2-seafloor-data/lambda_${{ matrix.function }}.zip \
          s3://data-platform-dtis-${ENV_NAME}-${AWS_ACCOUNT_ID}-raw-data/lambda_packages/lambda_${{ matrix.function }}.zip"
          aws s3 cp infrastructure/2-seafloor-data/lambda_${{ matrix.function }}.zip \
          s3://data-platform-dtis-${ENV_NAME}-${AWS_ACCOUNT_ID}-raw-data/lambda_packages/lambda_${{ matrix.function }}.zip
      - name: Skip packaging - ${{ matrix.function }} (cache hit)
        if: steps.lambda_cache.outputs.cache-hit  == 'true'
        run: echo "Cache hit — skipping ${{ matrix.function }} Lambda packaging."
      - name: Upload Artifact - ${{ matrix.function }}
        uses: actions/upload-artifact@v4
        with:
          name: lambda-zips-${{ matrix.function }}
          path: infrastructure/2-seafloor-data/lambda_${{ matrix.function }}.zip

  terraform-deployment:
    runs-on: ubuntu-latest
    needs: lambda-package
    environment: ${{ (github.ref_name == 'prod' || github.ref_name == 'main') && 'prod' || 'dev' }}
    env:
      TF_VAR_environment: ${{ (github.ref_name == 'prod' || github.ref_name == 'main') && 'prod' || 'dev' }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      - name: Download all Lambda zip artifacts
        uses: actions/download-artifact@v4
        with:
          path: ./downloaded-lambdas
      - name: Move lambda zips
        shell: bash
        run: |
          find ./downloaded-lambdas -name "*.zip" -exec mv {} infrastructure/2-seafloor-data/ \;
          ls -l infrastructure/2-seafloor-data/
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-southeast-2
      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v2
        with:
          terraform_version: 1.5.6
      - name: Terraform Init
        shell: bash
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          MONGO_URI: ${{ secrets.MONGO_URI }}
        run: |
          echo "access key id (partial): ${AWS_ACCESS_KEY_ID:0:4}"
          echo "secret access key (partial): ${AWS_SECRET_ACCESS_KEY:0:4}"
          echo "mongo uri (partial): ${MONGO_URI:53:63}"
          echo "env name: ${ENV_NAME}"
          cd infrastructure/2-seafloor-data
          AWS_ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
          echo "AWS Account ID (partial): ${AWS_ACCOUNT_ID:0:4}"
          terraform_state_bucket="data-platform-dtis-${ENV_NAME}-${AWS_ACCOUNT_ID}-terraform-state"
          terraform_key="niwa-dtis-ofop/${ENV_NAME}/${ENV_NAME}.tfstate"
          echo "Running terraform init with bucket: ${terraform_state_bucket}"
          echo "and key: ${terraform_key}"
          terraform init -reconfigure \
            -backend-config="bucket=${terraform_state_bucket}" \
            -backend-config="key=${terraform_key}"
      - name: Terraform Plan
        run: |
          cd infrastructure/2-seafloor-data
          if aws ssm get-parameter --name /dtis/biigle/disk-id --region ap-southeast-2 >/dev/null 2>&1; then
            BIIGLE_DISK_ID=$(aws ssm get-parameter --name /dtis/biigle/disk-id --region ap-southeast-2 --query Parameter.Value --output text)
            terraform plan -out=plan.tfplan \
              -var="mongo_uri=${{secrets.MONGO_URI}}" \
              -var="biigle_disk_id=${BIIGLE_DISK_ID}"
          else
            terraform plan -out=plan.tfplan \
              -var="mongo_uri=${{secrets.MONGO_URI}}"
          fi
      - name: Terraform Apply
        run: |
          cd infrastructure/2-seafloor-data
          terraform apply -auto-approve plan.tfplan

  system-tests:
    runs-on: ubuntu-latest
    needs: [scripts-unit-tests, terraform-deployment]
    steps:
      - name: Checkout code
        uses: actions/checkout@v2
      - name: Set up Bash
        run: sudo apt-get install -y bash
      - name: Set execute permissions
        run: chmod +x ./tasks
      - name: Run System Tests
        run: |
          chmod +x ./tasks
          echo "TODO - system-tests"
          exit 1
        continue-on-error: true
