name: CI/CD Pipeline

on:
  push:
    branches:
      - main

jobs:
  infra-checkov:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v2
      - name: Set up Docker
        uses: docker/setup-buildx-action@v1
      - name: Set execute permissions
        run: chmod +x ./tasks
      - name: Set up Bash
        run: sudo apt-get install -y bash
      - name: Run Checkov
        run: |
          chmod +x ./tasks
          ./tasks checkov_alpine
        continue-on-error: true
        if: always()
      - name: Upload Checkov Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: checkov-report
          path: results.xml

  scripts-shellcheck:
    runs-on: ubuntu-latest
    needs: infra-checkov
    steps:
      - name: Checkout code
        uses: actions/checkout@v2
      - name: Set up Bash
        run: sudo apt-get install -y bash
      - name: Set execute permissions
        run: chmod +x ./tasks
      - name: Run ShellCheck
        run: |
          chmod +x ./tasks
          ./tasks shellcheck_alpine || true
      - name: Upload ShellCheck Report
        uses: actions/upload-artifact@v4
        with:
          name: shellcheck-report
          path: shellcheck_report.xml

  scripts-unit-tests:
    runs-on: ubuntu-latest
    needs: scripts-shellcheck
    steps:
      - name: Checkout code
        uses: actions/checkout@v2
      - name: Set execute permissions
        run: chmod +x ./tasks
      - name: Set up Bash
        run: sudo apt-get install -y bash
      - name: Run Unit Tests
        run: ./tasks bats_alpine
      - name: Upload Unit Test Report
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-report
          path: upload/test/bats/report.xml

  scripts-package:
    runs-on: ubuntu-latest
    needs: scripts-unit-tests
    steps:
      - name: Checkout code
        uses: actions/checkout@v2
      - name: Set up Bash
        run: sudo apt-get install -y bash
      - name: Set execute permissions
        run: chmod +x ./tasks
      - name: Package
        run: |
          chmod +x ./tasks
          echo "TODO - Package Upload Script"
          exit 1
        continue-on-error: true

  lambda-unit-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v2
      - name: Set execute permissions
        run: chmod +x ./tasks
      - name: Set up Bash
        run: sudo apt-get install -y bash
      - name: Run Lambda Unit Tests
        run: ./tasks lambda_unit_tests_alpine
      - name: Upload Lambda Unit Test Report
        uses: actions/upload-artifact@v4
        with:
          name: lambda-unit-test-report
          path: processing/report.xml

  lambda-integration-tests:
    runs-on: ubuntu-latest
    needs: lambda-unit-tests
    steps:
      - name: Checkout code
        uses: actions/checkout@v2
      - name: Set up Bash
        run: sudo apt-get install -y bash
      - name: Set execute permissions
        run: chmod +x ./tasks
      - name: Run Lambda Integration Tests
        run: |
          chmod +x ./tasks
          echo "TODO - lambda-integration-tests"
          exit 1
        continue-on-error: true

  lambda-package:
    runs-on: ubuntu-latest
    needs: lambda-integration-tests
    steps:
      - name: Checkout code
        uses: actions/checkout@v2
      - name: Set up Bash
        run: sudo apt-get install -y bash
      - name: Set execute permissions
        run: chmod +x ./tasks
      - name: Package Lambda
        run: |
          chmod +x ./tasks
          echo "TODO - lambda-package"
          exit 1
        continue-on-error: true

  lambda-deployment:
    runs-on: ubuntu-latest
    needs: [lambda-package, infra-checkov]
    steps:
      - name: Checkout code
        uses: actions/checkout@v2
      - name: Set up Bash
        run: sudo apt-get install -y bash
      - name: Set execute permissions
        run: chmod +x ./tasks
      - name: Deploy Lambda
        run: |
          chmod +x ./tasks
          echo "TODO - lambda-deployment"
          exit 1
        continue-on-error: true

  system-tests:
    runs-on: ubuntu-latest
    needs: [scripts-unit-tests, lambda-deployment]
    steps:
      - name: Checkout code
        uses: actions/checkout@v2
      - name: Set up Bash
        run: sudo apt-get install -y bash
      - name: Set execute permissions
        run: chmod +x ./tasks
      - name: Run System Tests
        run: |
          chmod +x ./tasks
          echo "TODO - system-tests"
          exit 1
        continue-on-error: true