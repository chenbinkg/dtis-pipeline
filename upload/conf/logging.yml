version: 1
formatters:
    simple:
        format: '%(asctime)s %(levelname)s %(message)s'
handlers:
    console:
        class: logging.StreamHandler
        level: DEBUG
        formatter: simple
        stream: ext://sys.stdout
    file:
        class: logging.handlers.TimedRotatingFileHandler
        formatter: simple
        filename: upload/log/upload.log
        when: midnight
        interval: 1
        # backupCount: 365
        encoding: utf8

root:
    level: INFO
    handlers: [console,file]