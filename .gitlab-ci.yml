# Using NIWA IT Provided Shell executor Runner (uses alpine:latest image)
infra-checkov:
  stage: check
  needs: []
  artifacts:
    reports:
      junit:
        - results.xml
  # We have more work to do here - deferred to later date.
  allow_failure: true
  before_script:
    - apk add -U bash
    - chmod +x ./tasks
  script:
    - bash -c "./tasks checkov_alpine"

scripts-shellcheck:
  stage: lint
  needs: []
  artifacts:
    reports:
      junit:
        - shellcheck_report.xml
  before_script:
    - apk add -U bash
    - chmod +x ./tasks
  script:
    - bash -c "./tasks shellcheck_alpine" || true

scripts-unit-tests:
  stage: unit-test
  needs: [scripts-shellcheck]
  artifacts:
    reports:
      junit:
        - upload/test/bats/report.xml
  before_script:
    - apk add -U bash
    - chmod +x ./tasks
  script:
    - bash -c "./tasks bats_alpine"

scripts-package:
  stage: package
  needs: [scripts-unit-tests]
  # We have more work to do here - Not yet implemented.
  allow_failure: true
  before_script:
    - apk add -U bash
    - chmod +x ./tasks
  script:
    - echo "TODO - Package Upload Script"
    - exit 1

